# Advisory Gitleaks secret scan (SEC-EPIC-5, #210).
# ADVISORY only — never blocks merges. Real-time secret scanning + push
# protection is a repo-level GitHub setting the owner must enable (see
# .github/ai/README.md). Scan output is redacted (--redact): nothing is logged.
name: Secret scanning (advisory)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v7 pinned to SHA 3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      # ADVISORY Gitleaks scan (SEC-EPIC-5, #210).
      # Continue-on-error: report only, never blocks merges.
      #
      # The previous invocation pulled gitleaks via the public Docker image
      # (gitleaks/gitleaks:v8.24.3); CI intermittently failed with "pull access
      # denied" (exit 125) on hosted runners (OPS-3.1, #375). We now run the
      # standalone release binary (same v8.24.3 engine, same .gitleaks.toml)
      # so the advisory scan never depends on the Docker daemon.
      - name: Run Gitleaks scan (advisory)
        run: |
          mkdir -p /tmp/gitleaks
          curl -sSL -o /tmp/gitleaks/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks/gitleaks.tar.gz -C /tmp/gitleaks
          /tmp/gitleaks/gitleaks git --redact --no-banner --exit-code 1
        continue-on-error: true
