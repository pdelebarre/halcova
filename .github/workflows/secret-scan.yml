# Advisory Gitleaks secret scan (SEC-EPIC-5, #210).
# ADVISORY only — never blocks merges. Real-time secret scanning + push
# protection is a repo-level GitHub setting the owner must enable (see
# .github/ai/README.md). Scan output is redacted (--redact): nothing is logged.
name: Secret scanning (advisory)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v7 pinned to SHA 3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      # Scan git history with Gitleaks' default rules (see .gitleaks.toml).
      # continue-on-error keeps this report-only: findings never fail the job.
      # SEC-5.4 (#211): pin the Gitleaks image to a concrete version instead of
      # `latest` so the scanner is reproducible (the BLOCKING secret scan is
      # part of security-ci.yml, #213).
      - name: Run Gitleaks scan
        run: |
          docker run --rm \
            -v "${PWD}:/repo" \
            --workdir /repo \
            gitleaks/gitleaks:v8.24.3 \
            git --redact --no-banner --exit-code 1
        continue-on-error: true
