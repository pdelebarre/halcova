name: SonarCloud Analysis

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - '**/*.json'
      - '**/*.yml'
      - '**/*.yaml'
      - '**/*.toml'
      - '**/*.env*'
      - '**/public/**'
      - '**/dist/**'
      - '**/__tests__/**'
      - '**/test/**'
      - '**/tests/**'
      - '**/*.test.ts'
      - '**/*.test.tsx'
      - '**/*.spec.ts'
      - '**/*.spec.tsx'
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - '**/*.json'
      - '**/*.yml'
      - '**/*.yaml'
      - '**/*.toml'
      - '**/*.env*'
      - '**/public/**'
      - '**/dist/**'
      - '**/__tests__/**'
      - '**/test/**'
      - '**/tests/**'
      - '**/*.test.ts'
      - '**/*.test.tsx'
      - '**/*.spec.ts'
      - '**/*.spec.tsx'

jobs:
  sonarcloud:
    name: Build, Test & SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v7 pinned to SHA 3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      # actions/setup-node@v7 pinned to SHA 820762786026740c76f36085b0efc47a31fe5020
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          # Node 22: the jsdom@30/undici@8 stack requires Node >= 22.19.0
          # (OPS-3.1, #375). Node 20 crashes the vitest worker.
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run tests with coverage
        run: npm run test:coverage
        continue-on-error: true

      # Advisory dependency scan (SEC-EPIC-5, #208) — report-only, never blocks
      # (the BLOCKING dependency gate is part of security-ci.yml, #213).
      - name: npm audit (advisory, non-blocking)
        run: |
          npm audit --audit-level=high \
            || echo "::warning::npm audit found high/critical vulnerabilities — advisory only, does not block merges"
        continue-on-error: true

      # SonarSource/sonarqube-scan-action@v8 pinned to SHA 22918119ff8e1ca75a623e15c8296b6ea4fbe28f
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
