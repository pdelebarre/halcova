name: SonarCloud Analysis

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: Build, Test & SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run tests with coverage
        run: npm run test:coverage
        continue-on-error: true

      # Advisory dependency scan (SEC-EPIC-5, #208) — report-only, never blocks.
      # npm install above generates a transient lockfile for the audit to read.
      - name: npm audit (advisory, non-blocking)
        run: |
          npm audit --audit-level=high \
            || echo "::warning::npm audit found high/critical vulnerabilities — advisory only, does not block merges"
        continue-on-error: true

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
