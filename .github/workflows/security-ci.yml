# Security CI merge gate (SEC-EPIC-5, #213).
#
# BLOCKING gate — unlike the advisory scans (secret-scan.yml, sonarcloud.yml),
# this workflow FAILS the check-run on critical/high security findings, so it
# blocks merges once it is added to the branch-protection required status
# checks. It covers three pillars:
#   - security unit tests (the negative security tests shipped with each epic),
#   - dependency checks (npm audit --audit-level=high) — fails on high/critical,
#   - secret scanning (Gitleaks, blocking mode).
#
# SAST is enforced OUT OF BAND via GitHub **CodeQL default setup** (enabled at
# repo level by the owner): the advanced-config CodeQL workflows
# (`codeql.yml` advisory and the former `sast` job below) were removed because
# default-setup rejects advanced-config SARIF uploads ("CodeQL analyses from
# advanced configurations cannot be processed when the default setup is
# enabled"). CodeQL default-setup runs code scanning on every push/PR and its
# results surface as code-scanning alerts. Add the **CodeQL default-setup
# check** to the branch-protection required status checks in Settings ->
# Code security and analysis / Branches so the SAST requirement actually gates
# merges. See #412.
#
# Branch protection is an OWNER action (Settings -> Branches): add the job
# names (`security-tests`, `dependency-audit`, `secret-scan`) AND the CodeQL
# default-setup check as required status checks. Until then this workflow
# reports but a human must enforce the gate. The exceptions policy (which
# findings can be waived, by whom, with a ticket) is documented in
# .github/ai/README.md.
#
# SEC-5.4 (#211): third-party actions are pinned to immutable commit SHAs
# (dependabot keeps them updated via PRs for the github-actions ecosystem).
#   - actions/checkout@v7 -> 3d3c42e5aac5ba805825da76410c181273ba90b1
#   - actions/setup-node@v7 -> 820762786026740c76f36085b0efc47a31fe5020
#
# Path filters: these jobs only run when real source or config files change.
# Pure doc/markdown/config-only PRs skip the gate. NOTE: if these jobs are
# listed as required status checks, a skipped run counts as "not run" and will
# block merge — in that case remove the paths filter or add a pass-through job.
name: Security CI (blocking gate)

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/security-ci.yml'
    paths-ignore:
      - 'src/**/*.test.ts'
      - 'src/**/*.test.tsx'
      - 'src/**/*.spec.ts'
      - 'src/**/*.spec.tsx'
      - 'src/**/__tests__/**'
      - 'src/**/test/**'
      - 'src/**/tests/**'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/security-ci.yml'
    paths-ignore:
      - 'src/**/*.test.ts'
      - 'src/**/*.test.tsx'
      - 'src/**/*.spec.ts'
      - 'src/**/*.spec.tsx'
      - 'src/**/__tests__/**'
      - 'src/**/test/**'
      - 'src/**/tests/**'

permissions:
  contents: read

jobs:
  security-tests:
    name: Security unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # Node 22: the jsdom@30/undici@8 stack requires Node >= 22.19.0 (see
      # undici engines). Node 20 crashes the vitest worker with
      # `webidl.util.markAsUncloneable is not a function` and drops test files
      # (OPS-3.1, #375). 22 is an Active LTS and matches the local toolchain.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Run lint
        run: npm run lint
      # Blocking: the full suite includes the security negative tests
      # (validation, CSRF, outage 503, XSS, rate-limit 429, safe-error, PWA
      # cache isolation). A regression there fails the merge.
      - name: Run the test suite (incl. security negative tests)
        run: npm test
      - name: Verify the production build
        run: npm run build

  # Real-Postgres RLS enforcement (ARCH-6.1 #165, HOLD 1). BLOCKING (no
  # continue-on-error): proves cross-tenant fail-closed AND admin-function
  # authorization against an ACTUAL PostgreSQL server on every PR/merge, using
  # the least-privilege `app_rls` role. The `npm test` job above only exercises
  # pg-mem (which cannot parse RLS DDL), so without this job there is ZERO
  # execution evidence for the RLS enforcement tests — that is the gap this
  # closes. Trust auth is used so no password literal is committed (nothing for
  # the secret scan to flag): the owner connects over the service port and the
  # test connects as `app_rls` (created WITH LOGIN by the provisioning step).
  rls-integration:
    name: Real-Postgres RLS enforcement
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: runout_owner
          POSTGRES_DB: runout
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RLS_INTEGRATION: '1'
      RLS_SUPER_URL: postgres://runout_owner@localhost:5432/runout
      RLS_APP_RLS_URL: postgres://app_rls@localhost:5432/runout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Apply base migrations (owner/superuser)
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ env.RLS_SUPER_URL }}
      - name: Provision least-privilege app_rls role (LOGIN, trust auth)
        run: |
          node --input-type=module <<'EOF'
          import pg from 'pg'
          const c = new pg.Client(process.env.RLS_SUPER_URL)
          await c.connect()
          await c.query(`
            DO $$
            BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'app_rls') THEN
                CREATE ROLE app_rls WITH LOGIN;
              ELSE
                ALTER ROLE app_rls WITH LOGIN;
              END IF;
            END
            $$;
          `)
          await c.end()
          EOF
      # BLOCKING — runs the REAL-Postgres integration suite (rls-integration
      # .test.js). RLS_INTEGRATION=1 + both URLs mean the suite RUNS here, it
      # does NOT skip (a missing URL would FAIL, not skip — see the test's
      # config guard). db:migrate:rls inside db:test:rls applies the RLS files
      # (idempotent; the role already exists WITH LOGIN, so it is left intact).
      - name: Run real-Postgres RLS integration tests (blocking)
        run: npm run db:test:rls
        env:
          DATABASE_URL: ${{ env.RLS_SUPER_URL }}

  dependency-audit:
    name: Dependency audit (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      # BLOCKING: fails on any high/critical advisory (no continue-on-error),
      # EXCEPT the Security-Auditor-approved dev-only no-fix set (issue #386).
      # Only the advisory sources in scripts/security/dependency-audit-allowlist.js
      # are exempted (extract-zip GHSA-jmr9-qjv8-65gv and sharp/libvips
      # GHSA-f88m-g3jw-g9cj); anything else — a new advisory, a new CVE on the
      # same package, or a non-exempt package — fails the job (fail-closed).
      # Exceptions require a filed ticket + Security Auditor sign-off (see
      # .github/ai/README.md, #213).
      - name: "npm audit (blocking on high/critical, with approved #386 allowlist)"
        run: |
          set -o pipefail
          # Capture the full JSON report AND npm's own exit code. The allowlist
          # gate decides pass/fail on high/critical findings, but npm's exit
          # state is forwarded to the gate so an audit failure (registry/network/
          # DNS/auth) cannot be masked. The gate FAILS CLOSED if the report is
          # error-shaped/incomplete (npm's `{"message","error"}` shape has no
          # `vulnerabilities`) — the BLOCKING gate must never pass while it
          # scanned nothing. `|| true` is deliberately removed: npm's exit code
          # is captured explicitly and the gate enforces the verdict.
          set +e
          npm audit --json > /tmp/npm-audit.json
          npm_exit=$?
          set -e
          node scripts/security/dependency-audit-allowlist.js "$npm_exit" < /tmp/npm-audit.json
      # BLOCKING regression gate (#413): the allowlist tests prove the gate is
      # FAIL-CLOSED (clean=pass, approved#386=pass, new-high=fail, new-CVE=fail,
      # audit-error-shape=fail, incomplete-report=fail). They run as a plain
      # `node` invocation (the test's documented entrypoint) so no test-runner
      # fragility is introduced for .mjs scripts, and a regression that makes
      # the gate fail-open fails this job.
      - name: Run dependency-audit allowlist regression tests (fail-closed, #413)
        run: node scripts/security/dependency-audit-allowlist.test.mjs

  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # BLOCKING: Gitleaks fails (exit 1) on any detected secret. Output is
      # redacted so nothing secret is logged.
      #
      # The previous step invoked gitleaks via a public Docker image
      # (gitleaks/gitleaks:v8.24.3); CI intermittently failed with "pull access
      # denied" (exit 125) because the image is not reliably pullable on hosted
      # runners (OPS-3.1, #375). We now run the standalone release binary
      # (same v8.24.3 engine, same .gitleaks.toml) so the scan never depends on
      # the Docker daemon. Over the full git history with fetch-depth 0 this
      # scan reports no leaks.
      - name: Run Gitleaks (blocking)
        run: |
          mkdir -p /tmp/gitleaks
          curl -sSL -o /tmp/gitleaks/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks/gitleaks.tar.gz -C /tmp/gitleaks
          /tmp/gitleaks/gitleaks git --redact --no-banner --exit-code 1

  # NOTE: the former `sast` job (advanced-config CodeQL, blocking on
  # high/critical) was removed in #412 because GitHub CodeQL default-setup is
  # enabled at repo level and rejects advanced-config SARIF uploads. SAST is
  # now enforced by default-setup code-scanning results (required check).
