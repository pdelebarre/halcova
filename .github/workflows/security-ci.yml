# Security CI merge gate (SEC-EPIC-5, #213).
#
# BLOCKING gate — unlike the advisory scans (secret-scan.yml, sonarcloud.yml),
# this workflow FAILS the check-run on critical/high security findings, so it
# blocks merges once it is added to the branch-protection required status
# checks. It covers three pillars:
#   - security unit tests (the negative security tests shipped with each epic),
#   - dependency checks (npm audit --audit-level=high) — fails on high/critical,
#   - secret scanning (Gitleaks, blocking mode).
#
# SAST is enforced OUT OF BAND via GitHub **CodeQL default setup** (enabled at
# repo level by the owner): the advanced-config CodeQL workflows
# (`codeql.yml` advisory and the former `sast` job below) were removed because
# default-setup rejects advanced-config SARIF uploads ("CodeQL analyses from
# advanced configurations cannot be processed when the default setup is
# enabled"). CodeQL default-setup runs code scanning on every push/PR and its
# results surface as code-scanning alerts. Add the **CodeQL default-setup
# check** to the branch-protection required status checks in Settings ->
# Code security and analysis / Branches so the SAST requirement actually gates
# merges. See #412.
#
# Branch protection is an OWNER action (Settings -> Branches): add the job
# names (`security-tests`, `dependency-audit`, `secret-scan`) AND the CodeQL
# default-setup check as required status checks. Until then this workflow
# reports but a human must enforce the gate. The exceptions policy (which
# findings can be waived, by whom, with a ticket) is documented in
# .github/ai/README.md.
#
# SEC-5.4 (#211): third-party actions are pinned to immutable commit SHAs
# (dependabot keeps them updated via PRs for the github-actions ecosystem).
#   - actions/checkout@v7 -> 3d3c42e5aac5ba805825da76410c181273ba90b1
#   - actions/setup-node@v7 -> 820762786026740c76f36085b0efc47a31fe5020
#
# paths-ignore: workflows skip when only non-code or test files change.
# NOTE: if these jobs are listed as required status checks, a skipped run
# counts as "not run" and will block merge — add a pass-through job in that case.
name: Security CI (blocking gate)

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - '**/*.json'
      - '**/*.yml'
      - '**/*.yaml'
      - '**/*.toml'
      - '**/*.env*'
      - '**/public/**'
      - '**/dist/**'
      - '**/__tests__/**'
      - '**/test/**'
      - '**/tests/**'
      - '**/*.test.ts'
      - '**/*.test.tsx'
      - '**/*.spec.ts'
      - '**/*.spec.tsx'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - '**/*.json'
      - '**/*.yml'
      - '**/*.yaml'
      - '**/*.toml'
      - '**/*.env*'
      - '**/public/**'
      - '**/dist/**'
      - '**/__tests__/**'
      - '**/test/**'
      - '**/tests/**'
      - '**/*.test.ts'
      - '**/*.test.tsx'
      - '**/*.spec.ts'
      - '**/*.spec.tsx'

permissions:
  contents: read

jobs:
  security-tests:
    name: Security unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Run lint
        run: npm run lint
      - name: Run the test suite (incl. security negative tests)
        run: npm test
      - name: Verify the production build
        run: npm run build

  rls-integration:
    name: Real-Postgres RLS enforcement
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: runout_owner
          POSTGRES_DB: runout
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RLS_INTEGRATION: '1'
      RLS_SUPER_URL: postgres://runout_owner@localhost:5432/runout
      RLS_APP_RLS_URL: postgres://app_rls@localhost:5432/runout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Apply base migrations (owner/superuser)
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ env.RLS_SUPER_URL }}
      - name: Provision least-privilege app_rls role (LOGIN, trust auth)
        run: |
          node --input-type=module <<'EOF'
          import pg from 'pg'
          const c = new pg.Client(process.env.RLS_SUPER_URL)
          await c.connect()
          await c.query(`
            DO $$
            BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'app_rls') THEN
                CREATE ROLE app_rls WITH LOGIN;
              ELSE
                ALTER ROLE app_rls WITH LOGIN;
              END IF;
            END
            $$;
          `)
          await c.end()
          EOF
      - name: Run real-Postgres RLS integration tests (blocking)
        run: npm run db:test:rls
        env:
          DATABASE_URL: ${{ env.RLS_SUPER_URL }}

  dependency-audit:
    name: Dependency audit (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: "npm audit (blocking on high/critical, with approved #386 allowlist)"
        run: |
          set -o pipefail
          set +e
          npm audit --json > /tmp/npm-audit.json
          npm_exit=$?
          set -e
          node scripts/security/dependency-audit-allowlist.js "$npm_exit" < /tmp/npm-audit.json
      - name: Run dependency-audit allowlist regression tests (fail-closed, #413)
        run: node scripts/security/dependency-audit-allowlist.test.mjs

  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Run Gitleaks (blocking)
        run: |
          mkdir -p /tmp/gitleaks
          curl -sSL -o /tmp/gitleaks/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks/gitleaks.tar.gz -C /tmp/gitleaks
          /tmp/gitleaks/gitleaks git --redact --no-banner --exit-code 1

  # NOTE: the former `sast` job (advanced-config CodeQL, blocking on
  # high/critical) was removed in #412 because GitHub CodeQL default-setup is
  # enabled at repo level and rejects advanced-config SARIF uploads. SAST is
  # now enforced by default-setup code-scanning results (required check).
