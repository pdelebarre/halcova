# CodeQL SAST for JavaScript/TypeScript (SEC-EPIC-5, #209).
# ADVISORY only — never blocks merges: the analyze step runs with
# continue-on-error so findings surface without gating the launch branch.
# The blocking security CI merge gate is a later milestone (#213).
name: CodeQL analysis (advisory)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL analyze (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        continue-on-error: true
