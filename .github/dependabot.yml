# Dependabot for npm + GitHub Actions updates (SEC-EPIC-5, #208).
# Advisory only: Dependabot opens update PRs; it never blocks merges.
#
# NOTE: npm updates require a committed lockfile (package-lock.json). The repo
# does not currently commit one — commit it as a follow-up for the npm
# ecosystem to resolve pinned versions (see .github/ai/README.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - security

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
