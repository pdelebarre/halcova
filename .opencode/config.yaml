# OpenCode Configuration with Token Optimization
# https://opencode.ai/docs/ecosystem/

# Plugin configuration
# Add these plugins to your global ~/.config/opencode/opencode.jsonc:
# {
#   "plugin": [
#     "@tarquinen/opencode-dcp@latest",
#     "@rtk/opencode-plugin@latest"
#   ]
# }

# Model configuration with cost-aware routing
models:
  # Use cheap models for exploration tasks (70% of agentic tokens)
  explorer: anthropic/haiku-3.5  # Fast, cheap for grep/find
  planner: anthropic/haiku-3.5   # Planning and task breakdown
  
  # Use expensive models only for complex reasoning
  coder: anthropic/sonnet-3.5    # Complex implementation
  debugger: anthropic/sonnet-3.5 # Deep debugging

# Auto-compact to prevent runaway sessions
autoCompact: true

# Terse agent output (saves output tokens)
caveman: true

# Tool output compression
compressToolOutput: true

# Limit file reads per turn
maxFileReads: 10

# Limit tool calls per turn
maxToolCalls: 5

# Session management
session:
  # Auto-start fresh session after N minutes idle
  idleTimeout: 10
  
  # Suggest /new after N turns
  suggestNewAfter: 15

# Logging (minimal to save tokens)
logLevel: warn
