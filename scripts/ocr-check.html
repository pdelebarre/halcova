<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Halcova OCR browser check</title>
</head>
<body>
  <pre id="out">starting…</pre>
  <script type="module">
    import { createWorker } from 'https://cdn.jsdelivr.net/npm/tesseract.js@6/dist/tesseract.esm.min.js'
    const out = document.getElementById('out')
    try {
      const worker = await createWorker('eng')
      out.textContent = 'Halcova OCR worker loaded.'
      await worker.terminate()
    } catch (error) {
      out.textContent = `OCR check failed: ${error.message}`
    }
  </script>
</body>
</html>
