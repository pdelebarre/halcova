[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"

# SEC-3.4 (#197) — production security headers for the SPA + assets.
#
# CSP notes:
#   - `script-src 'self'` — the shell has no inline scripts (index.html only
#     loads /src/main.jsx), so no 'unsafe-inline'/'nonce' is needed for scripts.
#   - `style-src 'self' 'unsafe-inline'` — React sets inline `style` attributes
#     (e.g. layout/dimensions), so inline styles must be allowed. This is the
#     one deliberate inline allowance; tighten later if the app stops using
#     inline style attributes.
#   - `img-src` allows the cover/lookup hosts (Discogs + Google) in addition to
#     'self' — covers are proxied through /.netlify/functions/*?action=cover
#     (same-origin), but a direct 3rd-party cover URL must not be blocked.
#   - `worker-src 'self' blob:` — the camera scanner / OCR spawn a Web Worker
#     from a blob.
#   - `camera=(self)` in Permissions-Policy: the barcode scanner needs the
#     camera on the same origin.
#   - `connect-src 'self'` — all API calls (including ?magic-link= fetches and
#     `me`) are same-origin (/.netlify/functions/*).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.discogs.com https://*.googleapis.com https://*.google.com https://*.googleusercontent.com; connect-src 'self'; font-src 'self' data:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

# Fingerprinted hashed assets are immutable — long max-age, no revalidation.
[[headers]]
  for = "/assets/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Cache-Control = "public, max-age=31536000, immutable"

