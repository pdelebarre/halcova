sonar.projectKey=pdelebarre_halcova
sonar.organization=pdelebarre

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclude non-code files from SonarCloud analysis
sonar.exclusions=\
  **/*.md,\
  **/*.mdx,\
  **/*.json,\
  **/*.yml,\
  **/*.yaml,\
  **/*.toml,\
  **/*.env*,\
  **/*.config.js,\
  **/*.config.ts,\
  **/public/**,\
  **/dist/**,\
  **/.github/**
